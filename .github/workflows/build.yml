
name: Build Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.16.0'

      - name: Enable npm debug logging
        run: |
          npm config set loglevel verbose
          npm config set audit false
          npm config set fund false

      - name: Verify environment
        run: |
          echo "=== Node.js version ==="
          node --version

          echo "=== npm version ==="
          npm --version

          echo "=== Working directory ==="
          pwd

          echo "=== Project files ==="
          ls -la

          echo "=== package.json ==="
          cat package.json

          echo "=== Lockfiles ==="
          ls -l package-lock.json npm-shrinkwrap.json 2>/dev/null || true

      - name: Update npm
        run: npm install --global npm@11.6.0

      - name: Verify updated npm
        run: |
          node --version
          npm --version
          npm doctor || true

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --verbose 2>&1 | tee npm-install-debug.log

      - name: Display npm installation diagnostics
        if: steps.install.outcome == 'failure'
        run: |
          echo "=== npm install failed ==="
          echo "=== Recent npm log files ==="
          find "$HOME/.npm/_logs" -type f -name '*debug-0.log' \
            -print 2>/dev/null | tail -5

          echo "=== Error details ==="
          grep -n -B 10 -A 20 -E \
            'ERR!|error|edgesOut|EUSAGE|ERESOLVE' \
            npm-install-debug.log | tail -200 || true

      - name: Stop if installation failed
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build -- --debug 2>&1 | tee npm-build-debug.log

      - name: Display build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== Build failed ==="
          tail -200 npm-build-debug.log

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify build output
        run: |
          echo "=== dist directory ==="
          ls -lah dist/

          echo "=== Build output files ==="
          find dist -maxdepth 3 -type f | head -200

          test -f dist/index.html || {
            echo "ERROR: dist/index.html was not generated."
            exit 1
          }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist
          path: dist/
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic-logs
          path: |
            npm-install-debug.log
            npm-build-debug.log
          if-no-files-found: ignore
