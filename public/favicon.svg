<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F284E"/>
    </linearGradient>
    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="helixGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Molecular Hex Lattice Background Hint -->
  <path d="M32 10 L44 17 L44 31 L32 38 L20 31 L20 17 Z" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.15"/>
  <path d="M32 26 L44 33 L44 47 L32 54 L20 47 L20 33 Z" fill="none" stroke="#2563EB" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Base Pairs / Hydrogen Bonds -->
  <line x1="22" y1="18" x2="42" y2="18" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="25" y1="26" x2="39" y2="26" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="29" y1="32" x2="35" y2="32" stroke="#60A5FA" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="25" y1="38" x2="39" y2="38" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="22" y1="46" x2="42" y2="46" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Primary DNA Helix Strand (Sinusoidal Arc Left-to-Right) -->
  <path d="M20 16 Q32 26 44 32 Q32 38 20 48" fill="none" stroke="url(#helixGrad1)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Secondary Complementary DNA Strand -->
  <path d="M44 16 Q32 26 20 32 Q32 38 44 48" fill="none" stroke="url(#helixGrad2)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Node Points (Nucleotide Base Markers) -->
  <circle cx="20" cy="16" r="3" fill="#00F0FF"/>
  <circle cx="44" cy="16" r="3" fill="#38BDF8"/>
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="20" cy="48" r="3" fill="#2563EB"/>
  <circle cx="44" cy="48" r="3" fill="#00F0FF"/>
</svg>
